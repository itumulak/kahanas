<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design review</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #16181d;
    --muted: #5c6270;
    --line: #d9dde4;
    --accent: #2f5fe0;
    --ok: #1c7c46;
    --warn: #8a5a00;
    --bad: #b3261e;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f25;
      --ink: #e8eaef;
      --muted: #9aa1b0;
      --line: #2c313a;
      --accent: #6f95ff;
      --ok: #58c98a;
      --warn: #e0b054;
      --bad: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 24px;
    align-items: baseline;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; display: flex; gap: 18px; flex-wrap: wrap; }
  .meta code { font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 16px;
    padding: 16px 20px 120px;
    align-items: start;
  }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr); } }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card > h2 {
    margin: 0;
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  .card > .body { padding: 14px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); align-items: center; }
  .group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .group > span { color: var(--muted); font-size: 12px; margin-right: 2px; }
  button, select, input, textarea {
    font: inherit;
    color: inherit;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 11px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .frames { display: flex; gap: 12px; padding: 14px; overflow: auto; background: var(--bg); }
  /* Full screen hands the whole viewport to the design and hides the panels.
     The frame keeps its real breakpoint size rather than being scaled to fit,
     since a scaled prototype is no longer being reviewed at the width it was
     composed for. */
  .card:fullscreen { border-radius: 0; display: flex; flex-direction: column; }
  .card:fullscreen .frames { flex: 1; align-items: flex-start; justify-content: center; }
  .card:fullscreen .controls { position: sticky; top: 0; z-index: 1; }
  .frame-wrap { flex: 0 0 auto; }
  .frame-wrap > figcaption { font-size: 12px; color: var(--muted); padding-bottom: 6px; }
  iframe { border: 1px solid var(--line); border-radius: 6px; background: #fff; display: block; }
  .findings { max-height: 300px; overflow-y: auto; }
  .finding { padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .finding:last-child { border-bottom: 0; }
  .finding .kind { font-weight: 600; }
  .kind-page-error, .kind-navigation-failed, .kind-external-request { color: var(--bad); }
  .kind-console-error, .kind-request-failed { color: var(--bad); }
  .kind-console-warning { color: var(--warn); }
  .finding .where { color: var(--muted); font-size: 12px; }
  .finding pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: var(--muted); }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .shots a { text-decoration: none; color: var(--muted); font-size: 11px; }
  /* A full page screenshot of a long surface is very tall. Crop the thumbnail to a
     consistent tile so the gallery stays scannable, and open the real image on click. */
  .shots img { width: 100%; height: 110px; object-fit: cover; object-position: top center; border: 1px solid var(--line); border-radius: 6px; display: block; margin-bottom: 4px; background: #fff; }
  .state-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .state-row:last-child { border-bottom: 0; }
  .yes { color: var(--ok); }
  .no { color: var(--bad); }
  .empty { color: var(--muted); padding: 14px; font-size: 13px; }
  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 20px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  footer .fields { display: flex; gap: 10px; flex: 1 1 420px; flex-wrap: wrap; }
  footer input, footer textarea { flex: 1 1 180px; min-width: 160px; }
  footer textarea { min-height: 38px; resize: vertical; }
  .decide { display: flex; gap: 8px; }
  .approve { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .changes { border-color: var(--warn); color: var(--warn); }
  .reject { border-color: var(--bad); color: var(--bad); }
  .notice { padding: 10px 14px; border-radius: 8px; font-size: 13px; width: 100%; }
  .notice.err { background: rgba(179,38,30,.12); color: var(--bad); }
  .notice.ok { background: rgba(28,124,70,.12); color: var(--ok); }
  .hash { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1 id="surface">Design review</h1>
  <div class="meta">
    <span id="path"></span>
    <span id="status"></span>
    <span>proposal <code class="hash" id="hash"></code></span>
    <span id="baseline-note"></span>
  </div>
</header>

<main>
  <section class="card" id="canvas">
    <div class="controls">
      <div class="group" id="breakpoints"><span>Breakpoint</span></div>
      <div class="group" id="states"><span>State</span></div>
      <div class="group" id="compare-group" hidden>
        <button id="compare" aria-pressed="false">Compare with approved</button>
      </div>
      <div class="group">
        <button id="fullscreen" aria-pressed="false">Full screen</button>
        <button id="open-tab">Open in a new tab</button>
        <button id="reload">Reload</button>
      </div>
    </div>
    <div class="frames" id="frames"></div>
  </section>

  <div style="display:grid; gap:16px;">
    <section class="card">
      <h2>Declared states</h2>
      <div id="state-report"><p class="empty">No capture pass recorded.</p></div>
    </section>

    <section class="card">
      <h2>Browser findings</h2>
      <div class="findings" id="findings"><p class="empty">No capture pass recorded.</p></div>
    </section>

    <section class="card">
      <h2>Captured screenshots</h2>
      <div class="body shots" id="shots"><p class="empty">None.</p></div>
    </section>
  </div>
</main>

<footer>
  <div class="fields">
    <input id="person" type="text" placeholder="Your name, required to approve" autocomplete="name">
    <textarea id="feedback" placeholder="Feedback, required to request changes or reject"></textarea>
  </div>
  <div class="decide">
    <button class="approve" data-decision="approve">Approve</button>
    <button class="changes" data-decision="request-changes">Request changes</button>
    <button class="reject" data-decision="reject">Reject</button>
  </div>
  <div id="notice"></div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let session = null;
let activeState = null;
let activeBreakpoint = null;
let comparing = false;

const slug = (v) => String(v).toLowerCase().trim().replace(/\s+/g, "-");
const stateHref = (file) => `${file}?_k=${Date.now()}${Math.random()}#state=${slug(activeState)}`;

function frameFor(file, breakpoint, label) {
  const wrap = document.createElement("figure");
  wrap.className = "frame-wrap";
  wrap.style.margin = "0";
  const cap = document.createElement("figcaption");
  cap.textContent = `${label} ${breakpoint.width} by ${breakpoint.height}`;
  const frame = document.createElement("iframe");
  frame.width = breakpoint.width;
  frame.height = breakpoint.height;
  // A cache busting query forces a real load, since a prototype may not listen
  // for a hash change.
  frame.src = stateHref(file);
  frame.title = `${label}, ${activeState}, ${breakpoint.name}`;
  wrap.append(cap, frame);
  return wrap;
}

function renderFrames() {
  const holder = $("frames");
  holder.textContent = "";
  const breakpoint = session.breakpoints.find((b) => b.name === activeBreakpoint);
  if (!breakpoint) return;
  holder.append(frameFor("proposal.html", breakpoint, "Proposal"));
  if (comparing && session.hasBaseline) {
    holder.append(frameFor("baseline.html", breakpoint, "Approved"));
  }
}

function pills(container, values, current, onPick) {
  for (const value of values) {
    const button = document.createElement("button");
    button.textContent = value;
    button.setAttribute("aria-pressed", String(value === current));
    button.addEventListener("click", () => {
      onPick(value);
      for (const sibling of container.querySelectorAll("button")) {
        sibling.setAttribute("aria-pressed", String(sibling.textContent === value));
      }
      renderFrames();
    });
    container.append(button);
  }
}

function renderStates() {
  const holder = $("state-report");
  const states = session.errors?.states ?? [];
  if (states.length === 0) return;
  holder.textContent = "";
  for (const entry of states) {
    const row = document.createElement("div");
    row.className = "state-row";
    const name = document.createElement("span");
    name.textContent = entry.state;
    const verdict = document.createElement("span");
    verdict.className = entry.activated ? "yes" : "no";
    verdict.textContent = entry.activated ? "reachable" : "did not activate";
    verdict.title = entry.note ?? "";
    row.append(name, verdict);
    holder.append(row);
  }
}

function renderFindings() {
  const holder = $("findings");
  const findings = session.errors?.findings ?? [];
  if (findings.length === 0) {
    holder.innerHTML = '<p class="empty">Nothing logged, thrown, or failed during the capture pass.</p>';
    return;
  }
  holder.textContent = "";
  for (const finding of findings) {
    const row = document.createElement("div");
    row.className = "finding";
    const kind = document.createElement("span");
    kind.className = `kind kind-${finding.kind}`;
    kind.textContent = finding.kind;
    const where = document.createElement("span");
    where.className = "where";
    where.textContent = ` ${finding.state ?? ""} ${finding.breakpoint ?? ""}`;
    const message = document.createElement("div");
    message.textContent = finding.message;
    row.append(kind, where, message);
    if (finding.detail) {
      const detail = document.createElement("pre");
      detail.textContent = finding.detail;
      row.append(detail);
    }
    holder.append(row);
  }
}

function renderShots() {
  const holder = $("shots");
  if (!session.screenshots?.length) return;
  holder.textContent = "";
  for (const name of session.screenshots) {
    const link = document.createElement("a");
    link.href = `screenshots/${name}`;
    link.target = "_blank";
    link.rel = "noopener";
    const img = document.createElement("img");
    img.src = `screenshots/${name}`;
    img.alt = name;
    img.loading = "lazy";
    link.append(img, document.createTextNode(name));
    holder.append(link);
  }
}

function notice(kind, text) {
  $("notice").innerHTML = "";
  const box = document.createElement("div");
  box.className = `notice ${kind}`;
  box.textContent = text;
  $("notice").append(box);
}

function lockDecisions(text) {
  for (const button of document.querySelectorAll("[data-decision]")) button.disabled = true;
  $("person").disabled = true;
  $("feedback").disabled = true;
  notice("ok", text);
}

async function decide(decision) {
  const person = $("person").value.trim();
  const feedback = $("feedback").value.trim();

  if (decision === "approve" && !person) {
    return notice("err", "Approving records your name against this revision. Add it first.");
  }
  if (decision !== "approve" && !feedback) {
    return notice("err", "Say what needs to change. A design returned with no reason comes back the same.");
  }
  const label = decision === "approve"
    ? `Approve this revision as ${person}? It becomes the design that gets built.`
    : `Send this back as ${decision.replace("-", " ")}?`;
  if (!window.confirm(label)) return;

  const response = await fetch("/api/decision", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      decision,
      person,
      feedback,
      proposalHash: session.manifest?.proposalHash ?? null,
    }),
  });
  const result = await response.json();
  if (!response.ok) return notice("err", result.error ?? "The session refused that decision.");

  lockDecisions(
    `Recorded ${result.decision} at ${result.decidedAt}. You can close this tab. The registry is stamped by the skill that started this session.`
  );
}

async function start() {
  session = await (await fetch("/api/session")).json();
  const manifest = session.manifest ?? {};

  $("surface").textContent = (manifest.surfaces ?? ["Design review"]).join(", ");
  $("path").textContent = manifest.prototypePath ?? "";
  $("status").textContent = manifest.status ? `status ${manifest.status}` : "";
  $("hash").textContent = (manifest.proposalHash ?? "").slice(0, 12);
  $("baseline-note").textContent = session.hasBaseline
    ? "revising an approved design"
    : "no previously approved version";

  session.breakpoints = session.errors?.breakpoints ?? [
    { name: "desktop", width: 1440, height: 900 },
    { name: "tablet", width: 834, height: 1112 },
    { name: "phone", width: 390, height: 844 },
  ];
  const stateNames = (session.errors?.states ?? []).map((s) => s.state);
  const states = stateNames.length ? stateNames : (manifest.states ?? ["default"]);

  activeBreakpoint = session.breakpoints[0]?.name;
  activeState = states[0];

  pills($("breakpoints"), session.breakpoints.map((b) => b.name), activeBreakpoint, (v) => (activeBreakpoint = v));
  pills($("states"), states, activeState, (v) => (activeState = v));

  if (session.hasBaseline) {
    $("compare-group").hidden = false;
    $("compare").addEventListener("click", (event) => {
      comparing = !comparing;
      event.target.setAttribute("aria-pressed", String(comparing));
      renderFrames();
    });
  }
  $("reload").addEventListener("click", renderFrames);

  // Full screen hands the viewport to the design. The frame keeps its breakpoint
  // size, so what you are looking at is still the width it was composed for.
  const canvas = $("canvas");
  $("fullscreen").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else canvas.requestFullscreen?.().catch((err) => notice("err", `Full screen refused: ${err.message}`));
  });
  document.addEventListener("fullscreenchange", () => {
    const on = document.fullscreenElement === canvas;
    $("fullscreen").setAttribute("aria-pressed", String(on));
    $("fullscreen").textContent = on ? "Leave full screen" : "Full screen";
  });

  // The prototype on its own, at native size, in a real tab. This is the same
  // thing a person gets by opening the file, and it is the honest way to judge
  // a surface the review frame is too small to hold.
  $("open-tab").addEventListener("click", () => {
    window.open(stateHref("proposal.html"), "_blank", "noopener");
  });

  renderFrames();
  renderStates();
  renderFindings();
  renderShots();

  for (const button of document.querySelectorAll("[data-decision]")) {
    button.addEventListener("click", () => decide(button.dataset.decision));
  }

  if (session.decided) {
    lockDecisions(`This session already recorded ${session.decision?.decision}.`);
  }
}

start().catch((err) => notice("err", `Could not load the session: ${err.message}`));
</script>
</body>
</html>
