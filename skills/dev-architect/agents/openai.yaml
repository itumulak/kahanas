# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Dev Architect"
  short_description: "Settle the stack, the design, and the build plan"
  default_prompt: "Run the dev-architect skill: read its SKILL.md, then design how this product gets built and how it looks. Settle the stack layer by layer, write the local development containers, produce an interactive HTML prototype per surface in .konteksto/designs/, and fill the planning documents in .konteksto/."
