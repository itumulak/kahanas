# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Dev Architect"
  short_description: "Settle the stack, the containers, and the build plan"
  default_prompt: "Run the dev-architect skill: read its SKILL.md, then settle how this product gets built. Walk the stack layer by layer, write the local development containers, audit any existing dependencies, and fill the planning documents in .konteksto/. Do not design any surface or write anything in .konteksto/designs/: on a project with a frontend the dev-design skill does that afterwards."
