# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Dev Scope"
  short_description: "Define what the product is, before anything is built"
  default_prompt: "Run the dev-scope skill: read its SKILL.md, then survey the project root and turn the idea into .konteksto/project-overview.md. Stay tool agnostic; the dev-architect skill picks the stack."
