# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Dev Design"
  short_description: "Design every surface, and get it approved"
  default_prompt: "Use $dev-design to design and review every required surface while preserving the person's design choices beside the recommendations in .konteksto/human-decisions.md."
