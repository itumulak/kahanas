# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Dev Test"
  short_description: "Write the test suite for what changed"
  default_prompt: "Run the dev-test skill: read its SKILL.md, then write tests for the uncommitted changes, grounded in the invariants and value sourcing recorded in architecture.md."
