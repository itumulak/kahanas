# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Dev Document"
  short_description: "Write the prose about a change"
  default_prompt: "Run the dev-document skill: read its SKILL.md, then pick a type and write it from the real commits, the diff, and the decision log. Types are pr, changelog, release-note, and postmortem."
