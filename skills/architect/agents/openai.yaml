# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Architect"
  short_description: "Settle the stack, the tooling, and the build plan"
  default_prompt: "Run the architect skill: read its SKILL.md, then design how this product gets built. Settle the stack layer by layer, write the local development containers, and fill the design and planning documents in .konteksto/."
