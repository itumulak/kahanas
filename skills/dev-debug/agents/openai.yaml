# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Dev Debug"
  short_description: "Find and fix the root cause of a bug"
  default_prompt: "Run the dev-debug skill: read its SKILL.md, then reproduce the bug, localize it, prove the root cause with evidence, and make the smallest fix that addresses it."
