# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Sync"
  short_description: "Make the documents true again after a change"
  default_prompt: "Run the sync skill: read its SKILL.md, then reconcile the progress tracker and ui registry against what the repo proves, and flag the design documents the change made stale."
