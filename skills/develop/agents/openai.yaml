# OpenAI Codex adapter. This file supplies the interface metadata Codex shows in
# its agent picker. The skill's actual instructions live in ../SKILL.md, which the
# Agent Skills client installs alongside this file and loads when the skill runs.
interface:
  display_name: "Develop"
  short_description: "Build the next task from the plan, one at a time"
  default_prompt: "Run the develop skill: read its SKILL.md, then build the next task from .konteksto/build-plan.md following the recorded code standards, and tick the progress tracker. Stop and route to the architect skill if a load bearing decision is owed."
